name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} lint and coding standards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.2' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './assets/vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Install PHPCS and WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev \
            squizlabs/php_codesniffer:^3.10 \
            wp-coding-standards/wpcs:^3.1 \
            dealerdirect/phpcodesniffer-composer-installer:^1.0 \
            phpcsstandards/phpcsutils:^1.0 \
            phpcsstandards/phpcsextra:^1.2

      - name: Run PHPCS (WordPress standard)
        run: '"$(composer global config bin-dir --absolute)/phpcs" --standard=WordPress --extensions=php --ignore=*/vendor/* .'
